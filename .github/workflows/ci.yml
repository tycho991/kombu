# Continuous integration (spec continuous-integration, design D10 of the project-scaffold change).
# Third-party actions are pinned to full commit SHAs; the comment names the release.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # Builds the APKs and runs all checks (--continue: report every failing check, not just the first):
      # unit tests, Android Lint (incl. Kombu's own checks),
      # detekt with formatting, coverage thresholds, module boundaries and the Play Services ban.
      - name: Build and check
        run: ./gradlew build --continue

      - name: Generate API documentation
        if: success() || failure()
        run: ./gradlew :dokkaGenerate

      - name: Upload coverage reports
        if: success() || failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-reports
          path: "**/build/reports/kover/"
          if-no-files-found: ignore

      - name: Upload API documentation
        if: success() || failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-docs
          path: build/dokka/html/
          if-no-files-found: ignore

      - name: Upload test, lint and detekt reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-reports
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results-*.html
            **/build/reports/detekt/
            **/build/reports/problems/
          if-no-files-found: ignore
